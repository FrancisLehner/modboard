name: Release

# A version tag builds every platform and publishes a GitHub Release with the
# zips. A manual run builds the same zips as workflow artifacts only, for
# testing a build without releasing it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # PyInstaller does not cross-compile: each zip is built on its own OS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: modboard-windows-x64
          - os: macos-latest
            asset: modboard-macos-arm64
          - os: macos-15-intel
            asset: modboard-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major-version tag, only full versions.
      - uses: astral-sh/setup-uv@v10.3.0

      # The Python version comes from .python-version.
      - run: uv sync --locked

      - run: uv run python -m unittest discover -s tests

      - run: uv run pyinstaller modboard.spec --noconfirm

      # A zip keeps the executable bit on macOS; the browser download would
      # drop it from a bare binary.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip ../${{ matrix.asset }}.zip modboard
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/modboard.exe -DestinationPath ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: "*.zip"
          generate_release_notes: true
